<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bapppeda App — Portal Aplikasi Bapppeda Sijunjung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14201A;
    --dusk-glow:#E9B85C;
    --paper-soft:#FBF8F0;
    --maroon:#7A2E2E;
    --muted:#CFC9B8;
    --line:rgba(255,255,255,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--ink);
    color:var(--paper-soft);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .stage{
    width:100%;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Background scene ---------- */
  .bg{
    position:absolute;
    inset:0;
    background-image:url('https://images.pexels.com/photos/626749/pexels-photo-626749.jpeg');
    background-size:cover;
    background-position:center;
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,32,26,0.2) 0%, rgba(20,32,26,0.08) 45%, rgba(20,32,26,0.32) 100%);
  }
  .scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, rgba(20,32,26,0.28) 0%, rgba(20,32,26,0.12) 38%, rgba(20,32,26,0.01) 62%);
  }

  /* ---------- Nav ---------- */
  .nav{
    position:relative; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 40px 0;
    max-width:1400px;
    margin:0 auto;
    width:100%;
  }
  .brand{ font-weight:600; font-size:0.95rem; letter-spacing:0.02em; }
  .nav-links{ display:flex; gap:28px; font-size:0.88rem; color:var(--muted); }
  .nav-links a:hover{ color:var(--paper-soft); }
  .nav-icons{ display:flex; gap:16px; align-items:center; }
  .icon-btn{
    width:34px;height:34px; border-radius:50%;
    background:rgba(255,255,255,0.14); border:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-soft); cursor:pointer;
  }
  @media (max-width:820px){ .nav-links{display:none;} }

  /* ---------- Main row: title beside cards ---------- */
  .main-row{
    position:relative; z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:64px;
    flex-wrap:wrap;
    padding:60px 40px;
    flex:1;
    max-width:1400px;
    margin:0 auto;
    width:100%;
  }
  @media (max-width:980px){
    .main-row{ padding:48px 24px; flex-direction:column; align-items:flex-start; }
  }

  .hero-content{ max-width:420px; flex-shrink:0; }
  .hero-content .eyebrow{ font-size:0.85rem; color:var(--muted); margin-bottom:14px; }
  .hero-content h1{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:clamp(2.8rem, 5vw, 4.4rem);
    line-height:0.95;
    margin:0 0 18px;
  }
  .hero-content p{
    color:var(--muted);
    font-size:0.96rem;
    max-width:36ch;
    margin:0;
  }

  /* ---------- Carousel ---------- */
  .carousel-col{ flex:1 1 480px; min-width:0; }

  .carousel-head{
    display:flex; justify-content:flex-end; gap:10px; margin-bottom:14px;
  }
  .arrow{
    width:38px;height:38px; border-radius:50%;
    border:1px solid var(--line); background:rgba(255,255,255,0.08);
    color:var(--paper-soft); cursor:pointer; font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;
  }
  .arrow:disabled{ opacity:0.35; cursor:default; }
  .arrow:focus-visible{ outline:2px solid var(--dusk-glow); outline-offset:2px; }

  .carousel{
    display:flex; gap:20px; overflow-x:auto;
    scroll-snap-type:x mandatory; scrollbar-width:none; padding-bottom:4px;
  }
  .carousel::-webkit-scrollbar{ display:none; }

  .card{
    scroll-snap-align:start;
    flex:0 0 230px;
    position:relative;
    height:300px;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:24px 18px;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 10px 30px rgba(0,0,0,0.22);
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .card:hover{
    background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.4);
  }
  .card[aria-disabled="true"]{ cursor:default; }
  .card-icon{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));
  }
  .card-body{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card-tag{
    font-size:0.72rem; font-weight:600; color:var(--paper-soft);
    opacity:0.85; margin-bottom:6px; display:block;
  }
  .card h3{
    font-family:'Archivo', sans-serif;
    font-size:1.1rem;
    margin:0;
    line-height:1.2;
  }
  .card-desc{
    font-size:0.78rem;
    color:rgba(255,255,255,0.85);
    margin:6px 0 0;
    max-width:22ch;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .card:hover .card-desc,
  .card:focus-visible .card-desc{
    max-height:60px;
    opacity:1;
    margin-top:6px;
  }
  .card:focus-visible{ outline:2px solid var(--dusk-glow); outline-offset:2px; }

  .carousel-footer{
    display:flex; justify-content:flex-end; margin-top:14px;
    font-size:0.85rem; color:var(--muted); letter-spacing:0.03em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="bg"></div>

  <div class="scrim"></div>

  <nav class="nav">
    <div class="brand">Bapppeda · Sijunjung</div>
    <div class="nav-links">
      <a href="#">Beranda</a>
      <a href="#apps">Aplikasi</a>
      <a href="#">Bantuan</a>
    </div>
    <div class="nav-icons">
      <button class="icon-btn" aria-label="Cari">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </nav>

  <div class="main-row" id="apps">
    <div class="hero-content">
      <div class="eyebrow">Portal internal</div>
      <h1>BAPPPEDA<br>APP</h1>
      <p>Satu pintu untuk seluruh aplikasi yang dirancang pegawai dan digunakan Bapppeda Kabupaten Sijunjung.</p>
    </div>

    <div class="carousel-col">
      <div class="carousel-head">
        <button class="arrow" id="prevBtn" aria-label="Sebelumnya">‹</button>
        <button class="arrow" id="nextBtn" aria-label="Berikutnya">›</button>
      </div>
      <div class="carousel" id="carousel"></div>
      <div class="carousel-footer" id="counter">01 / 03</div>
    </div>
  </div>
</div>

<script>
  const apps = [
    {
      name: "E-Verifikasi Renja",
      url: "https://verifikasi-renja-sijunjung.netlify.app/",
      desc: "Pemeriksaan Renja OPD oleh verifikator.",
      category: "Perencanaan",
      colors: ["#2E5A45", "#163024"],
      status: "live",
      icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'
    },
    {
      name: "Kajian & Penelitian Daerah",
      url: "https://kajianlitbang.netlify.app/",
      desc: "Arsip kajian Litbangda Sijunjung.",
      category: "Litbang",
      colors: ["#7A2E2E", "#3A1414"],
      status: "live",
      icon: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'
    },
    {
      name: "SIBAK",
      url: "https://sibakppepd.netlify.app/",
      desc: "Sistem Basis Data Analisis Kebijakan.",
      category: "Analisis kebijakan",
      colors: ["#C99A45", "#5C4419"],
      status: "live",
      icon: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>'
    }
  ];

  const carousel = document.getElementById('carousel');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  apps.forEach(app => {
    const isLive = app.status === 'live';
    const tag = isLive ? app.category : `${app.category} · Segera hadir`;

    const card = document.createElement(isLive ? 'a' : 'div');
    card.className = 'card';
    card.style.setProperty('--card-a', app.colors[0]);
    card.style.setProperty('--card-b', app.colors[1]);
    if(isLive){
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener';
    } else {
      card.setAttribute('aria-disabled', 'true');
    }
    card.tabIndex = 0;

    card.innerHTML = `
      <div class="card-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${app.icon}</svg>
      </div>
      <div class="card-body">
        <span class="card-tag">${tag}</span>
        <h3>${app.name}</h3>
        <p class="card-desc">${app.desc}</p>
      </div>
    `;
    carousel.appendChild(card);
  });

  function updateControls(){
    const maxScroll = carousel.scrollWidth - carousel.clientWidth - 2;
    prevBtn.disabled = carousel.scrollLeft <= 0;
    nextBtn.disabled = carousel.scrollLeft >= maxScroll;

    const slideWidth = carousel.querySelector('.card').offsetWidth + 20;
    const index = Math.round(carousel.scrollLeft / slideWidth) + 1;
    const total = apps.length;
    counter.textContent = String(Math.min(index, total)).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  }

  function scrollByCard(dir){
    const slideWidth = carousel.querySelector('.card').offsetWidth + 20;
    carousel.scrollBy({ left: dir * slideWidth, behavior: 'smooth' });
  }

  prevBtn.addEventListener('click', () => scrollByCard(-1));
  nextBtn.addEventListener('click', () => scrollByCard(1));
  carousel.addEventListener('scroll', () => requestAnimationFrame(updateControls));
  window.addEventListener('resize', updateControls);

  updateControls();
</script>

</body>
</html>
